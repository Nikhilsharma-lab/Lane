name: Tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# A newer push to the same ref cancels the run still going for the older one.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# pnpm/action-setup reads the pnpm version from "packageManager" in package.json,
# so CI and local installs stay on the same release without a second pin here.

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck

      - run: pnpm lint

      - run: pnpm design:check

  # Plan §2.4 item 6 and the Phase 1b exit: no route's first-load client JS
  # grows more than 2 KB gzip over docs/design-system/bundle-baseline.json.
  # A PR that has to grow past it updates the baseline in the same PR, with a
  # written waiver (scripts/bundle-baseline.mjs --update).
  bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # Placeholders only: the build needs the names to exist, never real values.
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_placeholder
      CLERK_SECRET_KEY: placeholder
      CLERK_JWT_KEY: placeholder
      KV_REST_API_URL: http://127.0.0.1:1
      KV_REST_API_TOKEN: placeholder
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:1
      SUPABASE_SECRET_KEY: placeholder
      DATABASE_URL: postgresql://x:y@127.0.0.1:1/none
      DATABASE_SSL_CA: placeholder
      ANTHROPIC_API_KEY: placeholder
      TRIAGE_TOKEN_SECRET: placeholder
      NEXT_PUBLIC_APP_URL: http://127.0.0.1:1

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm build

      - run: pnpm bundle:check

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=5

    env:
      DATABASE_URL: postgresql://postgres@localhost:5432/lane_test
      PGUSER: postgres
      PGHOST: localhost
      PGPORT: "5432"
      NEXT_PUBLIC_SUPABASE_URL: http://localhost:54321
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: test-key-not-used
      SUPABASE_SECRET_KEY: test-secret-not-used
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      TRIAGE_TOKEN_SECRET: test-triage-secret-not-real

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm test
